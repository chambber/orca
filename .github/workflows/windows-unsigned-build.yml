name: Windows Unsigned Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/wsl-native-project-support

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --ignore-scripts

      - name: Ensure Native Runtime
        run: node config/scripts/ensure-native-runtime.mjs --runtime=electron

      - name: Desktop Build
        run: pnpm run build:desktop

      - name: Build Unsigned Windows Installer
        # Usa o comando subjacente do build:win do package.json, mas forçando publicação nula e sem certificado
        run: pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never -c.win.certificateFile=null

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orca-windows-installer
          path: dist/*.exe
